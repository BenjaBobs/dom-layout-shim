name: Bug report
description: Report incorrect package behavior that is not specifically a Chromium parity mismatch.
title: "bug: "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Bug report
      description: Describe the runtime, expected and actual behavior, and the smallest reproduction you can provide.
    validations:
      required: true
