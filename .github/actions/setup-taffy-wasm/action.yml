name: Set up Taffy WebAssembly
description: Install the pinned Rust toolchain and build the repository-owned Taffy binding.

runs:
  using: composite
  steps:
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: 1.98.0
        targets: wasm32-unknown-unknown

    - name: Install wasm-pack
      uses: taiki-e/install-action@e6be025a8b1320b83b144a9d72ce7409b69a7fe3 # wasm-pack
      with:
        tool: wasm-pack@0.15.0

    - name: Build Taffy WebAssembly binding
      shell: bash
      run: node scripts/build-taffy-wasm.mjs
