name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Affected scopes
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.scopes.outputs.package }}
      parity: ${{ steps.scopes.outputs.parity }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scopes
        run: >-
          node scripts/affected-scopes.mjs
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.event.pull_request.head.sha || github.sha }}"
          "${{ github.event_name }}"

  branch-history:
    name: Feature branch history
    if: github.event_name == 'pull_request' || github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject merge commits introduced by the pull request
        run: >-
          node scripts/check-pr-history.mjs
          "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          "${{ github.event.pull_request.head.sha || github.sha }}"

  package:
    name: Package checks
    needs: affected
    if: >-
      always() &&
      (needs.affected.result != 'success' || needs.affected.outputs.package == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require successful classification
        if: needs.affected.result != 'success'
        run: |
          echo "::error title=Affected scope classification failed::Package checks cannot be skipped safely."
          exit 1

      - name: Check out repository
        if: needs.affected.result == 'success' && needs.affected.outputs.package == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        if: needs.affected.result == 'success' && needs.affected.outputs.package == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        if: needs.affected.result == 'success' && needs.affected.outputs.package == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: needs.affected.result == 'success' && needs.affected.outputs.package == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate CSS support inventory
        if: needs.affected.result == 'success' && needs.affected.outputs.package == 'true'
        run: pnpm run css:check

      - name: Typecheck
        if: needs.affected.result == 'success' && needs.affected.outputs.package == 'true'
        run: pnpm run typecheck

      - name: Run unit tests
        if: needs.affected.result == 'success' && needs.affected.outputs.package == 'true'
        run: pnpm test

      - name: Check examples
        if: needs.affected.result == 'success' && needs.affected.outputs.package == 'true'
        run: pnpm run examples:check

      - name: Test packed package
        if: needs.affected.result == 'success' && needs.affected.outputs.package == 'true'
        run: pnpm run test:package

  browser-parity-linux:
    name: Chromium parity (ubuntu-24.04)
    needs: affected
    if: >-
      always() &&
      (needs.affected.result != 'success' || needs.affected.outputs.parity == 'true')
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - name: Require successful classification
        if: needs.affected.result != 'success'
        run: |
          echo "::error title=Affected scope classification failed::Chromium parity cannot be skipped safely."
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromium parity tests
        run: pnpm run test:browser-parity
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

  browser-parity-hosts:
    name: Chromium parity (${{ matrix.os }})
    needs: affected
    if: >-
      always() &&
      (needs.affected.result != 'success' || needs.affected.outputs.parity == 'true')
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require successful classification
        if: needs.affected.result != 'success'
        run: |
          echo "::error title=Affected scope classification failed::Chromium parity cannot be skipped safely."
          exit 1

      - name: Check out repository
        if: needs.affected.result == 'success' && needs.affected.outputs.parity == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        if: needs.affected.result == 'success' && needs.affected.outputs.parity == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        if: needs.affected.result == 'success' && needs.affected.outputs.parity == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: needs.affected.result == 'success' && needs.affected.outputs.parity == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: needs.affected.result == 'success' && needs.affected.outputs.parity == 'true'
        run: pnpm exec playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: .playwright-browsers

      - name: Run Chromium parity tests
        if: needs.affected.result == 'success' && needs.affected.outputs.parity == 'true'
        run: pnpm run test:browser-parity

  browser-parity-status:
    name: Chromium parity
    needs:
      - affected
      - browser-parity-linux
      - browser-parity-hosts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful Chromium parity matrix
        if: >-
          needs.affected.result != 'success' ||
          (
            needs.affected.outputs.parity == 'true' &&
            (
              needs.browser-parity-linux.result != 'success' ||
              needs.browser-parity-hosts.result != 'success'
            )
          )
        run: |
          echo "::error title=Chromium parity failed::One or more platform matrix jobs did not succeed."
          exit 1

      - name: Report successful Chromium parity matrix
        if: >-
          needs.browser-parity-linux.result == 'success' &&
          needs.browser-parity-hosts.result == 'success'
        run: echo "All Chromium parity platform jobs succeeded."

      - name: Report unaffected Chromium parity
        if: >-
          needs.affected.result == 'success' &&
          needs.affected.outputs.parity != 'true'
        run: echo "Chromium parity is not affected by this change."
