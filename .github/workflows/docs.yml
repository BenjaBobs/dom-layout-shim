name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the generated site
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.scopes.outputs.docs }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scopes
        run: >-
          node scripts/affected-scopes.mjs
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.event.pull_request.head.sha || github.sha }}"
          "${{ github.event_name }}"

      - name: Configure Pages
        if: steps.scopes.outputs.docs == 'true' && github.event.repository.visibility == 'public'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up pnpm
        if: steps.scopes.outputs.docs == 'true'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        if: steps.scopes.outputs.docs == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.scopes.outputs.docs == 'true'
        run: pnpm install --frozen-lockfile

      - name: Validate and generate support data
        if: steps.scopes.outputs.docs == 'true'
        run: |
          node scripts/css-support.mjs validate
          node scripts/css-support.mjs generate
          node scripts/generate-docs-pages.mjs
          node scripts/generate-changelog-page.mjs

      - name: Upload Pages artifact
        if: steps.scopes.outputs.docs == 'true' && github.event.repository.visibility == 'public'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site

      - name: Report unaffected documentation
        if: steps.scopes.outputs.docs != 'true'
        run: echo "Documentation is not affected by this change."

  deploy:
    if: >-
      needs.build.outputs.docs == 'true' &&
      github.event.repository.visibility == 'public' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy)
      )
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
