name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run release:version
          title: Version Packages
          commit: "chore(cfg): Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run required checks on the version pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: |
          gh workflow run ci.yml --ref changeset-release/main
          gh workflow run docs.yml --ref changeset-release/main -f deploy=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  inspect:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.release.outputs.package_name }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_release: ${{ steps.release.outputs.should_release }}
      should_run: ${{ steps.release.outputs.should_run }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect release state
        id: release
        run: node scripts/inspect-release-state.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: needs.inspect.outputs.should_run == 'true'
    needs: inspect
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    environment: npm
    permissions:
      actions: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CSS support inventory
        run: pnpm run css:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Test packed package
        run: pnpm run test:package

      - name: Run Chromium parity tests
        run: pnpm run test:browser-parity
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - name: Publish package to npm
        if: needs.inspect.outputs.should_publish == 'true'
        run: npm publish --access public

      - name: Prepare release notes
        if: needs.inspect.outputs.should_release == 'true'
        run: node scripts/extract-release-notes.mjs "${{ needs.inspect.outputs.version }}" .tmp/release-notes.md

      - name: Create GitHub Release and missing tag
        if: needs.inspect.outputs.should_release == 'true'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { readFile } = await import('node:fs/promises')
            const body = await readFile('.tmp/release-notes.md', 'utf8')
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: '${{ needs.inspect.outputs.tag }}',
              target_commitish: context.sha,
              name: '${{ needs.inspect.outputs.package_name }} ${{ needs.inspect.outputs.version }}',
              body,
            })

      - name: Redeploy documentation after publishing
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: 'docs.yml',
              ref: 'main',
              inputs: { deploy: 'true' },
            })
