name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update version pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run release:version
          title: Version Packages
          commit: "chore(cfg): Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run required checks on the version pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: |
          gh workflow run ci.yml --ref changeset-release/main
          gh workflow run docs.yml --ref changeset-release/main -f deploy=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  inspect:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.release.outputs.package_name }}
      should_publish: ${{ steps.release.outputs.should_publish }}
      should_release: ${{ steps.release.outputs.should_release }}
      should_run: ${{ steps.release.outputs.should_run }}
      should_tag: ${{ steps.release.outputs.should_tag }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Inspect release state
        id: release
        run: node scripts/inspect-release-state.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: needs.inspect.outputs.should_run == 'true'
    needs: inspect
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate CSS support inventory
        run: pnpm run css:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Test packed package
        run: pnpm run test:package

      - name: Install Chromium
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright-browsers pnpm exec playwright install --with-deps chromium

      - name: Run Chromium parity tests
        run: pnpm run test:browser-parity

      - name: Publish package to npm
        if: needs.inspect.outputs.should_publish == 'true'
        run: npm publish --access public

      - name: Create release tag
        if: needs.inspect.outputs.should_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.inspect.outputs.tag }}"
          git push origin "${{ needs.inspect.outputs.tag }}"

      - name: Prepare release notes
        if: needs.inspect.outputs.should_release == 'true'
        run: node scripts/extract-release-notes.mjs "${{ needs.inspect.outputs.version }}" .tmp/release-notes.md

      - name: Create GitHub Release
        if: needs.inspect.outputs.should_release == 'true'
        run: >-
          gh release create "${{ needs.inspect.outputs.tag }}"
          --verify-tag
          --title "${{ needs.inspect.outputs.package_name }} ${{ needs.inspect.outputs.version }}"
          --notes-file .tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
