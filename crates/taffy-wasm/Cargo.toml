[package]
name = "dom-layout-shim-taffy-wasm"
version = "0.0.0"
edition = "2024"
description = "Repository-owned Taffy WebAssembly binding for dom-layout-shim"
license = "Unlicense"
repository = "https://github.com/BenjaBobs/dom-layout-shim"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.81"
taffy = { version = "=0.14.0", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout", "content_size"] }
wasm-bindgen = "0.2.104"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# wasm-pack 0.15 currently bundles a Binaryen build that cannot validate the
# bulk-memory instructions emitted by Rust 1.98. Rust still applies size
# optimization and LTO; re-enable wasm-opt once wasm-pack updates Binaryen.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
