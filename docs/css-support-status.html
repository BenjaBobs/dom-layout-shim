<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Support Status</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-2: #eef3f8;
      --text: #17202a;
      --muted: #657282;
      --line: #d9e0e8;
      --green: #1c7c54;
      --green-bg: #e5f4ec;
      --amber: #9a6400;
      --amber-bg: #fff2d2;
      --red: #b23b3b;
      --red-bg: #fde5e5;
      --blue: #246b9f;
      --blue-bg: #e4f1fb;
      --violet: #7251a4;
      --violet-bg: #eee7f8;
      --gray-bg: #edf0f3;
      --claim-bg: #fbfcfd;
      --heading-text: #394654;
      --chip-text: #34414f;
      --error-line: #e3b4b4;
      --error-bg: #fff1f1;
      --error-text: #7b2525;
      --mark-bg: #ffe58a;
      --mark-text: #332400;
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1519;
        --panel: #172126;
        --panel-2: #202d34;
        --text: #e7eff2;
        --muted: #9eacb3;
        --line: #334149;
        --green: #70d6ad;
        --green-bg: #173c31;
        --amber: #ffd078;
        --amber-bg: #493919;
        --red: #ff9b9b;
        --red-bg: #492526;
        --blue: #8dccff;
        --blue-bg: #19364b;
        --violet: #c4a7f5;
        --violet-bg: #34294a;
        --gray-bg: #29353b;
        --claim-bg: #121b20;
        --heading-text: #c7d4da;
        --chip-text: #d6e1e5;
        --error-line: #744244;
        --error-bg: #3b2022;
        --error-text: #ffb9b9;
        --mark-bg: #735d16;
        --mark-text: #fff2b0;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }

    header {
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 680;
      letter-spacing: 0;
    }

    .subhead {
      margin: 6px 0 0;
      color: var(--muted);
    }

    main {
      padding: 20px 28px 32px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(5, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      min-height: 76px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 24px;
      font-weight: 700;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    input,
    select {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1040px;
    }

    th,
    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: var(--panel-2);
      color: var(--heading-text);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .title {
      font-weight: 700;
    }

    .id {
      margin-top: 2px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge svg {
      width: 14px;
      height: 14px;
    }

    .status-full,
    .status-supported,
    .status-verified {
      color: var(--green);
      background: var(--green-bg);
    }

    .status-partial {
      color: var(--amber);
      background: var(--amber-bg);
    }

    .status-todo,
    .status-unsupported,
    .status-unverified,
    .status-known-mismatch {
      color: var(--red);
      background: var(--red-bg);
    }

    .effect-layout {
      color: var(--blue);
      background: var(--blue-bg);
    }

    .effect-hit-testing {
      color: var(--violet);
      background: var(--violet-bg);
    }

    .effect-visual,
    .effect-visual-ignored,
    .effect-inert,
    .effect-accepted-inert,
    .effect-source {
      color: var(--muted);
      background: var(--gray-bg);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      max-width: 420px;
    }

    .chip {
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--gray-bg);
      color: var(--chip-text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
    }

    a.chip {
      text-decoration: none;
    }

    a.chip:hover {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .claims {
      display: grid;
      gap: 10px;
      min-width: 300px;
      max-width: 560px;
    }

    .claim {
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--claim-bg);
    }

    .claim-head {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-bottom: 7px;
    }

    .claim-title {
      margin-right: auto;
      font-weight: 700;
    }

    .claim-description {
      margin-bottom: 7px;
    }

    .claim-section {
      margin-top: 7px;
    }

    .claim-label {
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .more {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    .notes {
      display: grid;
      gap: 6px;
      max-width: 560px;
    }

    .note {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 6px;
    }

    .note svg {
      width: 15px;
      height: 15px;
      margin-top: 2px;
      color: var(--muted);
    }

    .note-kind {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .parity-count {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .parity-count svg {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }

    .fixture-link {
      color: inherit;
    }

    .fixture-link:hover {
      color: var(--blue);
      text-decoration: underline;
    }

    .error {
      padding: 16px;
      border: 1px solid var(--error-line);
      border-radius: 8px;
      background: var(--error-bg);
      color: var(--error-text);
    }

    mark {
      padding: 0 1px;
      border-radius: 2px;
      background: var(--mark-bg);
      color: var(--mark-text);
    }

    @media (max-width: 900px) {
      header,
      main {
        padding-left: 16px;
        padding-right: 16px;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(130px, 1fr));
      }

      .toolbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="./" style="color: var(--green); font-weight: 700; text-decoration: none;">← Documentation</a>
    <h1>CSS Support Status</h1>
    <p class="subhead">Generated from the machine-readable records in <code>support/css/</code></p>
  </header>

  <main>
    <section class="summary" id="summary" aria-label="Summary"></section>

    <section class="toolbar" aria-label="Filters">
      <input id="search" type="search" placeholder="Search title, property, element, fixture, or note">
      <select id="status">
        <option value="">All statuses</option>
      </select>
      <select id="effect">
        <option value="">All effects</option>
      </select>
      <select id="owner">
        <option value="">All owners</option>
      </select>
      <select id="parityStatus">
        <option value="">All parity</option>
      </select>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Area</th>
            <th>Status</th>
            <th>Effect</th>
            <th>Owner</th>
            <th>Parity Status</th>
            <th>Properties / Elements</th>
            <th>Support claims and evidence</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>

  <script>
    const sourcePath = './data/css-support.json'
    const statusOrder = ['supported', 'partial', 'unsupported', 'unknown']
    const effectOrder = ['layout', 'hit-testing', 'visual-ignored', 'accepted-inert', 'source']
    const ownerOrder = ['css-parser', 'taffy-adapter', 'hit-testing', 'text', 'dom-api']
    const parityStatusOrder = ['verified', 'partially-verified', 'unverified', 'known-mismatch', 'not-applicable']
    let inventory = []

    const icons = {
      full: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>',
      supported: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>',
      verified: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>',
      partial: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v18"/><path d="M5 12h14"/></svg>',
      todo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>',
      note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h14v16H5z"/><path d="M8 8h8"/><path d="M8 12h8"/><path d="M8 16h5"/></svg>',
      parity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16"/><path d="M12 4v16"/><path d="m7 7 10 10"/><path d="m17 7-10 10"/></svg>'
    }

    init().catch((error) => {
      document.querySelector('main').innerHTML = `
        <div class="error">
          <strong>Could not load the CSS support inventory.</strong>
          <p>${escapeHtml(error.message)}</p>
          <p>Open this page through a local HTTP server from the repository root so the browser can fetch ${sourcePath}.</p>
        </div>
      `
    })

    async function init() {
      inventory = await loadInventory()
      populateFilters()
      restoreFilters()
      render()
      document.getElementById('search').addEventListener('input', render)
      document.getElementById('status').addEventListener('change', render)
      document.getElementById('effect').addEventListener('change', render)
      document.getElementById('owner').addEventListener('change', render)
      document.getElementById('parityStatus').addEventListener('change', render)
    }

    function restoreFilters() {
      const parameters = new URLSearchParams(location.search)
      document.getElementById('search').value = parameters.get('q') || ''
      document.getElementById('status').value = parameters.get('status') || ''
      document.getElementById('effect').value = parameters.get('effect') || ''
      document.getElementById('owner').value = parameters.get('owner') || ''
      document.getElementById('parityStatus').value = parameters.get('parity') || ''
    }

    async function loadInventory() {
      const response = await fetch(`${sourcePath}?t=${Date.now()}`)

      if (!response.ok) {
        throw new Error(`Fetch failed: ${response.status} ${response.statusText}`)
      }

      const payload = await response.json()
      return payload.records
    }

    function populateFilters() {
      fillSelect('status', statusOrder)
      fillSelect('effect', effectOrder)
      fillSelect('owner', ownerOrder)
      fillSelect('parityStatus', parityStatusOrder)
    }

    function fillSelect(id, values) {
      const select = document.getElementById(id)

      for (const value of values) {
        const option = document.createElement('option')
        option.value = value
        option.textContent = label(value)
        select.append(option)
      }
    }

    function render() {
      const query = document.getElementById('search').value.trim().toLowerCase()
      const status = document.getElementById('status').value
      const effect = document.getElementById('effect').value
      const owner = document.getElementById('owner').value
      const parityStatus = document.getElementById('parityStatus').value
      updateLocation({ query, status, effect, owner, parityStatus })
      const filtered = inventory.filter((entry) => {
        if (status && entry.status !== status) return false
        if (effect && entry.effect !== effect) return false
        if (owner && entry.owner !== owner) return false
        if (parityStatus && entry.parityStatus !== parityStatus) return false
        if (!query) return true

        const haystack = [
          entry.id,
          entry.title,
          entry.status,
          entry.effect,
          entry.owner,
          entry.parityStatus,
          ...(entry.subjects.properties || []),
          ...(entry.subjects.elements || []),
          ...entry.claims.flatMap((claim) => [
            claim.id,
            ...(claim.properties || []),
            ...(claim.syntax || []),
            ...(claim.conditions || []),
            ...claim.parity.fixtures,
            ...claim.notes.flatMap((note) => [note.kind, note.text]),
          ]),
        ].join(' ').toLowerCase()

        return haystack.includes(query)
      })

      renderSummary(filtered)
      renderRows(filtered, query)
    }

    function updateLocation({ query, status, effect, owner, parityStatus }) {
      const parameters = new URLSearchParams()
      if (query) parameters.set('q', query)
      if (status) parameters.set('status', status)
      if (effect) parameters.set('effect', effect)
      if (owner) parameters.set('owner', owner)
      if (parityStatus) parameters.set('parity', parityStatus)
      history.replaceState(null, '', parameters.size > 0 ? `?${parameters}` : location.pathname)
    }

    function renderSummary(entries) {
      const implementedProperties = unique(
        inventory
          .filter((entry) => entry.status !== 'unsupported')
          .flatMap((entry) => entry.subjects.properties || [])
          .filter((property) => !property.includes('*')),
      )
      const metrics = [
        ['Areas', entries.length],
        ['Properties', implementedProperties.length],
        ['Supported', inventory.filter((entry) => entry.status === 'supported').length],
        ['Partial', inventory.filter((entry) => entry.status === 'partial').length],
        ['Unsupported', inventory.filter((entry) => entry.status === 'unsupported').length],
      ]

      document.getElementById('summary').innerHTML = metrics.map(([name, value]) => `
        <div class="metric">
          <div class="metric-label">${escapeHtml(name)}</div>
          <div class="metric-value">${value}</div>
        </div>
      `).join('')
    }

    function renderRows(entries, query) {
      document.getElementById('rows').innerHTML = entries.map((entry) => `
        <tr>
          <td>
            <div class="title">${highlight(entry.title, query)}</div>
            <div class="id">${highlight(entry.id, query)}</div>
          </td>
          <td>${badge(entry.status, `status-${entry.status}`)}</td>
          <td>${badge(entry.effect, `effect-${entry.effect}`)}</td>
          <td>${badge(entry.owner, 'effect-source')}</td>
          <td>${badge(entry.parityStatus, parityStatusClass(entry.parityStatus))}</td>
          <td>
            ${propertyChips(entry.subjects.properties || [], 12, query)}
            ${entry.subjects.elements?.length ? `<div class="id">Elements</div>${chips(entry.subjects.elements, 12, query)}` : ''}
          </td>
          <td>${claims(entry.claims, document.getElementById('search').value.trim().toLowerCase())}</td>
        </tr>
      `).join('')
    }

    function badge(value, className) {
      return `<span class="badge ${className}">${icons[value] || ''}${escapeHtml(label(value))}</span>`
    }

    function parityStatusClass(value) {
      if (value === 'verified') {
        return 'status-full'
      }

      if (value === 'unverified' || value === 'known-mismatch') {
        return 'status-todo'
      }

      return 'status-partial'
    }

    function propertyChips(values, limit, query) {
      if (values.length === 0) {
        return '<span class="more">None</span>'
      }

      const visible = prioritizeMatches(values, query).slice(0, limit)
      const hidden = values.length - visible.length
      return `
        <div class="chips">
          ${visible.map((value) => `
            <a class="chip" href="?q=${encodeURIComponent(value)}" title="Show support for ${escapeHtml(value)}">${highlight(value, query)}</a>
          `).join('')}
          ${hidden > 0 ? `<span class="chip more">+${hidden}</span>` : ''}
        </div>
      `
    }

    function chips(values, limit, query = '') {
      if (values.length === 0) {
        return '<span class="more">None</span>'
      }

      const visible = prioritizeMatches(values, query).slice(0, limit)
      const hidden = values.length - visible.length
      return `
        <div class="chips">
          ${visible.map((value) => `<span class="chip">${highlight(value, query)}</span>`).join('')}
          ${hidden > 0 ? `<span class="chip more">+${hidden}</span>` : ''}
        </div>
      `
    }

    function claims(values, query) {
      const propertyClaims = values.filter((claim) => claim.properties?.includes(query))
      const visible = propertyClaims.length > 0 ? propertyClaims : values
      return `
        <div class="claims">
          ${visible.map((claim) => `
            <article class="claim" id="${escapeHtml(claim.id)}">
              <div class="claim-head">
                <span class="claim-title">${highlight(label(claim.id), query)}</span>
                ${badge(claim.support, `status-${claim.support}`)}
                ${badge(claim.parity.status, parityStatusClass(claim.parity.status))}
              </div>
              ${claim.description ? `<div class="claim-description">${highlight(claim.description, query)}</div>` : ''}
              ${claim.properties?.length ? claimValues('Properties', claim.properties, query) : ''}
              ${claim.syntax?.length ? claimValues('Syntax', claim.syntax, query) : ''}
              ${claim.conditions?.length ? claimValues('Conditions', claim.conditions, query) : ''}
              ${claim.parity.fixtures.length ? `
                <div class="claim-section">
                  <div class="claim-label">Chromium parity evidence</div>
                  ${fixtureChips(claim.parity.fixtures, query)}
                </div>
              ` : ''}
              ${claim.notes.length ? `<div class="claim-section">${notes(claim.notes, query)}</div>` : ''}
            </article>
          `).join('')}
        </div>
      `
    }

    function claimValues(name, values, query) {
      return `
        <div class="claim-section">
          <div class="claim-label">${escapeHtml(name)}</div>
          ${chips(values, 20, query)}
        </div>
      `
    }

    function fixtureChips(values, query) {
      return `
        <div class="chips">
          ${values.map((value) => `
            <a
              class="chip fixture-link"
              href="https://github.com/BenjaBobs/dom-layout-shim/blob/main/test/browser-parity/cases/${encodeURIComponent(value)}.test.ts"
            >${highlight(value, query)}</a>
          `).join('')}
        </div>
      `
    }

    function notes(values, query) {
      if (values.length === 0) {
        return '<span class="more">No notes</span>'
      }

      return `
        <div class="notes">
          ${values.map((note) => `
            <div class="note">
              ${icons.note}
              <div>
                <div class="note-kind">${highlight(label(note.kind), query)}</div>
                <div>${highlight(note.text, query)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `
    }

    function unique(values) {
      return [...new Set(values)]
    }

    function prioritizeMatches(values, query) {
      if (!query) return values
      return [...values].sort((left, right) =>
        Number(String(right).toLowerCase().includes(query)) - Number(String(left).toLowerCase().includes(query)),
      )
    }

    function highlight(value, query) {
      const text = String(value)
      if (!query) return escapeHtml(text)
      const normalized = text.toLowerCase()
      let cursor = 0
      let output = ''
      let index = normalized.indexOf(query)
      while (index !== -1) {
        output += escapeHtml(text.slice(cursor, index))
        output += `<mark>${escapeHtml(text.slice(index, index + query.length))}</mark>`
        cursor = index + query.length
        index = normalized.indexOf(query, cursor)
      }
      return output + escapeHtml(text.slice(cursor))
    }

    function label(value) {
      return String(value).replaceAll('-', ' ').replace(/\b\w/g, (char) => char.toUpperCase())
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;')
    }
  </script>
</body>
</html>
